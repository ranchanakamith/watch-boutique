name: Watch Boutique CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  test-and-lint:
    name: 1. Unit & Integration Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Execute Backend Test Suite (29 Automated Tests)
        run: |
          cd backend
          npm test

  build-frontend:
    name: 2. Frontend Typecheck & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production SPA
        run: |
          cd frontend
          npm run build

  docker-pipeline:
    name: 3. Docker Build & Container Health Probe
    needs: [test-and-lint, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          tags: watch-boutique:ci-latest
          load: true

      - name: Spin Up Container & Smoke Test
        run: |
          docker run -d \
            --name test-boutique-app \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e APP_ORIGIN=http://localhost:3000 \
            watch-boutique:ci-latest

          echo "Waiting for container initialization..."
          sleep 6

          docker ps

          echo "Probing container health endpoint..."
          curl --fail --retry 5 --retry-delay 2 http://localhost:3000/api/health || exit 1

          echo "Probing public catalog endpoint..."
          curl --fail http://localhost:3000/api/products?limit=5 || exit 1

          echo "Docker container smoke tests passed with flying colors!"
          docker stop test-boutique-app
