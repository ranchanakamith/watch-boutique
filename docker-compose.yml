services:
  watch-boutique:
    build:
      context: .
      dockerfile: Dockerfile
    image: watch-boutique:latest
    container_name: watch-boutique-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=3000
      - APP_ORIGIN=http://localhost:3000
      # Optional: Auto-grant admin role upon registration
      # - INITIAL_ADMIN_EMAIL=admin@boutique.com
      # Optional Resend email delivery:
      # - RESEND_API_KEY=re_your_api_key
      # - MAIL_FROM=Watch Boutique <store@yourdomain.com>
      # - CONTACT_INBOX=concierge@yourdomain.com
    volumes:
      # Persistent volume for SQLite database across container recreations
      - boutique_db_data:/app/backend/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - boutique-network

volumes:
  boutique_db_data:
    driver: local

networks:
  boutique-network:
    driver: bridge
