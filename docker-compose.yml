services:
  database:
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      POSTGRES_DB: boutique
      POSTGRES_USER: boutique
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boutique-lab-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boutique -d boutique"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
      DATABASE_URL: ${DATABASE_URL:-postgresql://boutique:${POSTGRES_PASSWORD:-boutique-lab-only}@database:5432/boutique}
      ACCOUNT_SECURITY_KEY: ${ACCOUNT_SECURITY_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CONTACT_INBOX: ${CONTACT_INBOX:-}
    volumes:
      - security_data:/app/backend/data
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 20
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  security_data:
